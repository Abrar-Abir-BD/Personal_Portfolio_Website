name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # "Run workflow" button, to deploy without a new commit

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm run test:e2e

      # Hands the build to the deploy job, so it ships exactly what was tested
      - name: Keep the build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          include-hidden-files: true # .htaccess
          retention-days: 1

  # Every push to main that passes the checks above goes live on abrarabir.com
  # (cPanel hosting), uploaded over FTP. Only files that changed since the last
  # deploy are sent. Needs the repo secrets FTP_SERVER, FTP_USERNAME and
  # FTP_PASSWORD (see DEPLOY.md); until they're set, this job skips its upload
  deploy:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits for the one in progress
    concurrency:
      group: deploy-abrarabir
      cancel-in-progress: false
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}

    steps:
      - name: Get the build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/

      - name: Note missing FTP details
        if: env.FTP_SERVER == ''
        run: echo "::notice::FTP_SERVER is not set, so nothing was uploaded. See DEPLOY.md."

      - name: Upload to abrarabir.com
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
