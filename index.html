<!DOCTYPE html>
<!-- data-design="glow" turns on the navy/grain design (src/styles/glow.css);
     remove it to go back to the original look -->
<html lang="en" data-design="glow">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#050913" />
    <meta
      name="description"
      content="Abrar Abir, a student researcher in AI and robotics from Bangladesh. Founder of SAPH.Ai, building low-cost water-testing devices and rescue robots. Projects, publications, awards and art."
    />
    <meta name="author" content="Abrar Abir" />

    <!-- Link previews. Each page's copy of these is written at build time
         (prerender in vite.config.ts) -->
    <link rel="canonical" href="https://abrarabir.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Abrar Abir" />
    <meta property="og:title" content="Abrar Abir - AI & Robotics Researcher" />
    <meta
      property="og:description"
      content="Student researcher in AI and robotics from Bangladesh. Founder of SAPH.Ai. Projects, publications, awards and art."
    />
    <meta property="og:url" content="https://abrarabir.com/" />
    <meta property="og:image" content="https://abrarabir.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Abrar Abir: AI & Robotics, Research, Art" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Abrar Abir - AI & Robotics Researcher" />
    <meta
      name="twitter:description"
      content="Student researcher in AI and robotics from Bangladesh. Founder of SAPH.Ai. Projects, publications, awards and art."
    />
    <meta name="twitter:image" content="https://abrarabir.com/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <title>Abrar Abir - AI & Robotics Researcher</title>
  </head>
  <body>
    <script>
      try {
        if (localStorage.getItem("theme") === "light")
          document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
