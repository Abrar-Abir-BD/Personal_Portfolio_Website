<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 935" preserveAspectRatio="xMidYMid slice">
  <!-- Page background for the glow design (see src/styles/glow.css): a soft
       silver wave rising out of black, after public/background.avif.
       Transparent above the wave so the page colour shows through. -->
  <defs>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-200" y="-200" width="2000" height="1400">
      <feGaussianBlur stdDeviation="22" />
    </filter>
    <filter id="haze" filterUnits="userSpaceOnUse" x="-200" y="-200" width="2000" height="1400">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3c8cc" />
      <stop offset="0.45" stop-color="#a9b0b8" />
      <stop offset="0.75" stop-color="#d4d8d8" />
      <stop offset="1" stop-color="#e2e5e3" />
    </linearGradient>
  </defs>

  <!-- the wave -->
  <path filter="url(#soft)" fill="url(#silver)"
    d="M-60 95 C 90 110 190 300 330 400 C 460 490 600 480 780 492 C 960 504 1060 540 1240 538 C 1420 536 1500 560 1660 610 L1660 1000 L-60 1000 Z" />

  <!-- warm, slightly iridescent rim along the crest -->
  <path filter="url(#soft)" fill="none" stroke="#c9a26a" stroke-width="10" opacity="0.55"
    d="M-60 95 C 90 110 190 300 330 400 C 460 490 600 480 780 492" />
  <path filter="url(#soft)" fill="none" stroke="#8fb6c9" stroke-width="8" opacity="0.35"
    d="M780 492 C 960 504 1060 540 1240 538 C 1420 536 1500 560 1660 610" />

  <!-- slate-blue shadow low on the left, and a soft fold in the middle -->
  <ellipse filter="url(#haze)" cx="330" cy="730" rx="470" ry="85" fill="#2d3d63" opacity="0.9" />
  <ellipse filter="url(#haze)" cx="1000" cy="640" rx="320" ry="70" fill="#7d8896" opacity="0.55" />
  <!-- brightest light, lower right -->
  <ellipse filter="url(#haze)" cx="1300" cy="790" rx="380" ry="150" fill="#eef0ec" opacity="0.7" />
</svg>
